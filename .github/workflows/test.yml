name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: python -m pip install --upgrade pip && python -m pip install -e .

    - name: Run tests
      run: python -m unittest discover -s tests -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Ruff
      run: python -m pip install ruff

    - name: Lint
      run: ruff check .

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: python -m pip install --upgrade pip build

    - name: Verify package version
      run: python -c "import tomllib; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == '1.5.0'"

    - name: Build package distribution (sdist and wheel)
      run: python -m build

    - name: Verify built distributions
      run: python -m pip install --no-deps dist/*.whl && python -c "from importlib.metadata import version; assert version('llm-sdk-py') == '1.5.0'"
