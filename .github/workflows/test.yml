name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: python -m pip install --upgrade pip && python -m pip install -e ".[pillow]" "pytest>=9,<10" "pydantic>=2,<3"

    - name: Run tests
      run: python -m pytest tests/ -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Ruff
      run: python -m pip install "ruff>=0.15,<1"

    - name: Lint
      run: ruff check .

  build:
    name: Build package
    needs: [test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: python -m pip install --upgrade pip "build>=1"

    - name: Verify package version
      run: |
        python - <<'EOF'
        import ast, pathlib, tomllib
        src = pathlib.Path("llm_sdk.py").read_text(encoding="utf-8")
        vs = []
        for n in ast.parse(src).body:
            if isinstance(n, ast.AnnAssign) and getattr(n.target, "id", "") == "__version__":
                if isinstance(n.value, ast.Constant):
                    vs.append(n.value.value)
            elif (
                isinstance(n, ast.Assign)
                and len(n.targets) == 1
                and getattr(n.targets[0], "id", "") == "__version__"
                and isinstance(n.value, ast.Constant)
            ):
                vs.append(n.value.value)
        assert len(vs) == 1, f"expected exactly one __version__, got {vs}"
        with open("pyproject.toml", "rb") as f:
            pv = tomllib.load(f)["project"]["version"]
        assert pv == vs[0], (pv, vs)
        EOF

    - name: Build package distribution (sdist and wheel)
      run: python -m build

    - name: Check distribution metadata
      run: python -m pip install "twine>=6,<7" && twine check dist/*

    - name: Verify built distributions
      run: python -m pip install --no-deps dist/*.whl && python -c "import tomllib; from importlib.metadata import version; assert version('llm-sdk-py') == tomllib.load(open('pyproject.toml', 'rb'))['project']['version']"
