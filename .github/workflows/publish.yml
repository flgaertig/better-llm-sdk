name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    if: github.repository == 'flgaertig/llm-sdk'
    permissions:
      # Checkout needs read access to the repository contents.
      contents: read
      # IMPORTANT: This permission is mandatory for trusted publishing
      id-token: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: python -m pip install --upgrade pip build

    - name: Verify release version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; tag = os.environ['RELEASE_TAG'].removeprefix('v'); assert version == tag == '1.5.0', f'Expected version 1.5.0 matching release tag, got {version!r} and {tag!r}'"

    - name: Build package distribution (sdist and wheel)
      run: python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
