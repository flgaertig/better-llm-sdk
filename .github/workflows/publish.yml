name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release (tests + lint)
    runs-on: ubuntu-latest
    if: github.repository == 'flgaertig/llm-sdk'
    timeout-minutes: 15
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: python -m pip install --upgrade pip && python -m pip install -e ".[pillow]" "pytest>=9,<10" "pydantic>=2,<3"

    - name: Run tests
      run: python -m pytest tests/ -q

    - name: Lint
      run: python -m pip install "ruff>=0.15,<1" && ruff check .

  build-and-publish:
    needs: [validate]
    name: Build and publish Python package
    runs-on: ubuntu-latest
    if: github.repository == 'flgaertig/llm-sdk'
    timeout-minutes: 20
    environment: pypi
    permissions:
      # Checkout needs read access to the repository contents.
      contents: read
      # IMPORTANT: This permission is mandatory for trusted publishing
      id-token: write
      # Needed for build provenance attestation.
      attestations: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: python -m pip install --upgrade pip "build>=1"

    - name: Verify release version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $RELEASE_TAG"; exit 1; }
        python - <<'EOF'
        import ast, os, pathlib, tomllib
        src = pathlib.Path("llm_sdk.py").read_text(encoding="utf-8")
        vs = []
        for n in ast.parse(src).body:
            if isinstance(n, ast.AnnAssign) and getattr(n.target, "id", "") == "__version__":
                if isinstance(n.value, ast.Constant):
                    vs.append(n.value.value)
            elif (
                isinstance(n, ast.Assign)
                and len(n.targets) == 1
                and getattr(n.targets[0], "id", "") == "__version__"
                and isinstance(n.value, ast.Constant)
            ):
                vs.append(n.value.value)
        assert len(vs) == 1, f"expected exactly one __version__, got {vs}"
        with open("pyproject.toml", "rb") as f:
            version = tomllib.load(f)["project"]["version"]
        tag = os.environ["RELEASE_TAG"].removeprefix("v")
        assert version == tag == vs[0], (
            f"Expected matching versions, got pyproject={version!r} "
            f"tag={tag!r} module={vs[0]!r}"
        )
        EOF

    - name: Build package distribution (sdist and wheel)
      run: python -m build

    - name: Check distribution metadata
      run: python -m pip install "twine>=6,<7" && twine check dist/*

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: "dist/*"

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
